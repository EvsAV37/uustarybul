<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Управление · Уустары бул</title>
<link rel="icon" type="image/png" href="../icons/favicon-64.png">
<link rel="preload" href="../fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts/onest.css">
<style>
/* Управление «Уустары бул» — оформление как в макете админки (14.10.2026): цвета и шрифт приложения, две темы */
:root{--bg:#FFFFFF;--fg:#0B0C0E;--mu:#6B7079;--sf:#F4F4F6;--pl:#EFEFF2;--ln:#E5E5EA;--ln2:#EFEFF2;--side:#F7F7F9;--card:#FFFFFF;--pr:#0B0C0E;--prf:#FFFFFF;--segon:#FFFFFF;--v:#3F434A;--off:#C4C7CD;--okt:#1A8048;--dgt:#B42318;--dgl:#F3C5C5;--rb:#FDECEC;--rf:#8A1C1C;--yb:#FFF1C2;--yf:#5C4200;--gb:#E3F3EA;--gf:#14653A;--nb:#E5E5EA;--nf:#3F434A;--star:#E0A11B;--warn:#9A5B00;--sh:0 1px 2px rgba(0,0,0,.08);--scrim:rgba(0,0,0,.35);color-scheme:light}
:root[data-theme="dark"]{--bg:#1A1B1F;--fg:#F5F5F7;--mu:#9499A3;--sf:#24262B;--pl:#2A2C31;--ln:#2E3035;--ln2:#2A2C31;--side:#202226;--card:#2A2C31;--pr:#F5F5F7;--prf:#1A1B1F;--segon:#3A3D43;--v:#CACED4;--off:#4A4E55;--okt:#3DD17D;--dgt:#FF6B6F;--dgl:#5A2E30;--rb:#33201F;--rf:#F2C4C6;--yb:#4A3B12;--yf:#F7E2A6;--gb:#1E3A2A;--gf:#8FE3B1;--nb:#3A3D43;--nf:#CACED4;--star:#F2B84B;--warn:#F2B84B;--sh:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1B1F;--fg:#F5F5F7;--mu:#9499A3;--sf:#24262B;--pl:#2A2C31;--ln:#2E3035;--ln2:#2A2C31;--side:#202226;--card:#2A2C31;--pr:#F5F5F7;--prf:#1A1B1F;--segon:#3A3D43;--v:#CACED4;--off:#4A4E55;--okt:#3DD17D;--dgt:#FF6B6F;--dgl:#5A2E30;--rb:#33201F;--rf:#F2C4C6;--yb:#4A3B12;--yf:#F7E2A6;--gb:#1E3A2A;--gf:#8FE3B1;--nb:#3A3D43;--nf:#CACED4;--star:#F2B84B;--warn:#F2B84B;--sh:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--fg)}a:hover{color:var(--v)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.logo{display:inline-block;flex:none;width:44px;height:32px;background:var(--fg);-webkit-mask:url(../icons/logo-mark.webp) center/contain no-repeat;mask:url(../icons/logo-mark.webp) center/contain no-repeat}
.d{font-size:13px;color:var(--mu)}
.h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:15px;color:var(--mu);margin-top:4px}
.h2{margin:0;font-size:20px;font-weight:700}
.up{color:var(--okt);font-weight:600}.down{color:var(--dgt);font-weight:600}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.red{background:var(--rb);color:var(--rf)}.yel{background:var(--yb);color:var(--yf)}.grn{background:var(--gb);color:var(--gf)}.gry{background:var(--nb);color:var(--nf)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:20px;background:var(--card);border:1px solid var(--ln);font-size:14px;font-weight:600;color:var(--fg);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--off);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pr{background:var(--pr);color:var(--prf);border-color:var(--pr)}
.btn.dg{color:var(--dgt);border-color:var(--dgl)}
.btn.sm{min-height:34px;padding:0 13px;border-radius:17px;font-size:13px}
.btn.big{min-height:52px;border-radius:16px;font-size:16px;width:100%}
.link{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:var(--pl);border-radius:12px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--segon);box-shadow:var(--sh);font-weight:600}
.seg.sm{display:flex}.seg.sm button{flex:1;height:30px;padding:0 4px;font-size:12px}
.f{height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--pl);font-size:14px;cursor:pointer;white-space:nowrap}
.f.on{background:var(--pr);color:var(--prf);font-weight:600}
.ava{width:40px;height:40px;border-radius:12px;color:#FFFFFF;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.skel{background:var(--sf);border-radius:20px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.empty{padding:28px 16px;text-align:center;color:var(--mu);font-size:15px}

/* Оболочка: компьютер — меню слева; телефон — вкладки внизу */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{flex:0 0 260px;padding:24px 16px;background:var(--side);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.main{flex:1;min-width:0;padding:32px 40px 48px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav span.na{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:15px;font-weight:500;text-decoration:none;color:var(--fg)}
.nav a:hover{background:var(--pl);color:var(--fg)}
.nav a.on{background:var(--pr);color:var(--prf)}
.nav span.na{color:var(--mu);cursor:default}
.nav svg{width:20px;height:20px;flex:none}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#C62828;color:#FFFFFF;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.cnt{margin-left:auto;font-size:13px;color:var(--mu);white-space:nowrap;padding-left:6px}
.on .cnt{color:var(--off)}
.foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--mu)}
.citysel{position:relative;display:block}
.citysel select{appearance:none;-webkit-appearance:none;width:100%;height:44px;padding:0 36px 0 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.citysel:after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.tabs{display:none}
.ptop{display:none}

/* Обзор */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--sf);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.k{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.v{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card{background:var(--sf);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln);text-decoration:none;color:var(--fg)}
.rows>.row:first-child{border-top:0}
a.row:hover{color:var(--fg)}
.chart{height:180px;display:flex;align-items:flex-end;gap:10px}
.chart.many{gap:3px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar>div{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:150px}
.bar i{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--fg);min-height:2px}
.bar i.s{background:var(--off)}
.bar i.r{background:var(--dgt)}
.bar span{font-size:11px;color:var(--mu);height:14px}
.legend{display:flex;gap:16px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Мастера */
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.grow{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.srch{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:var(--sf);min-width:280px;color:var(--mu)}
.srch input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-size:15px;color:var(--fg)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.tblw{overflow-x:auto;border:1px solid var(--ln);border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);padding:10px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--ln2);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sf)}
tr.sel td{background:var(--sf)}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:160px}
.who{display:flex;align-items:center;gap:12px}
.split.detail table{min-width:0}
.split.detail .opt{display:none}
.box .d{display:block;font-size:12px;line-height:1.3}
.mlist{display:none}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:.5px solid var(--ln);text-decoration:none;color:var(--fg)}
.it:first-child{border-top:0}
.nm{font-weight:600}
.panel{flex:1 1 340px;min-width:0;max-width:440px;padding:22px;border-radius:22px;background:var(--sf);display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
.panel.wide{max-width:none}
.box{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}
.box b{display:block;font-size:18px}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--ln)}
.ln{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* Жалобы */
.queue{flex:1 1 300px;max-width:380px;display:flex;flex-direction:column;gap:4px}
.q{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;text-align:left;background:transparent;border:0;cursor:pointer;width:100%;text-decoration:none;color:var(--fg)}
.q:hover{background:var(--pl);color:var(--fg)}
.q.on{background:var(--sf)}
.qt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.case{flex:999 1 480px;min-width:0;border-radius:22px;background:var(--sf);padding:22px;display:flex;flex-direction:column;gap:16px}
.cmp{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.alert{background:var(--rb);color:var(--rf);border-radius:14px;padding:12px 14px;font-size:14px}
.note{background:var(--yb);color:var(--yf);border-radius:14px;padding:12px 14px;font-size:14px}
.rvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rv{border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rv p{margin:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.star{color:var(--star);letter-spacing:1px}
.warn{color:var(--warn);font-weight:600}

/* Справочники и настройки */
.dlist{flex:1 1 280px;max-width:340px;display:flex;flex-direction:column;gap:2px}
.dgrp{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);margin:14px 12px 4px}
.di{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border-radius:12px;font-size:15px;text-decoration:none;color:var(--fg)}
.di:hover{background:var(--pl);color:var(--fg)}
.di.on{background:var(--sf);font-weight:600}
.di.off{color:var(--mu)}
.di .tail{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.ed{flex:999 1 480px;min-width:0;border-radius:22px;background:var(--sf);padding:24px;display:flex;flex-direction:column;gap:18px}
.fl{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl>span{font-size:13px;font-weight:600;color:var(--v)}
.fl small{font-size:12px;color:var(--mu);font-weight:400}
.in{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font:inherit;font-size:15px;color:var(--fg);width:100%;outline:none}
.in:focus,.words:focus-within{border-color:var(--fg)}
select.in{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.words{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--ln)}
.words input{border:0;outline:none;font:inherit;font-size:14px;min-width:140px;flex:1;background:transparent;color:var(--fg);height:30px}
.wd{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 4px 0 12px;border-radius:15px;font-size:14px;background:var(--nb);white-space:nowrap}
.wd button{border:0;background:none;width:26px;height:26px;border-radius:13px;cursor:pointer;color:var(--mu);font-size:16px;line-height:1}
.wd button:hover{color:var(--fg);background:var(--off)}
@media (min-width:900px){ .ed{position:sticky;top:24px} }
.swl{display:flex;align-items:center;gap:10px;min-height:44px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--off);position:relative;flex:none;border:0;cursor:pointer;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:left .15s}
.sw[aria-checked="true"]{background:var(--okt)}
.sw[aria-checked="true"]::after{left:23px}
.sw:disabled{opacity:.5;cursor:default}
.lim{width:100%;border-collapse:collapse;font-size:15px;min-width:0}
.lim th,.lim td{padding:12px 0;white-space:normal}
.lim td+td,.lim th+th{text-align:right;padding-left:12px}
.lim tbody tr{cursor:default}
.lim tbody tr:hover td{background:transparent}
.bigv{font-size:30px;font-weight:700;letter-spacing:-.01em}
.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.g2d{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dcard{display:flex;flex-direction:column;gap:6px;background:var(--sf);border-radius:14px;padding:14px}
@media (max-width:899px){.g2d{grid-template-columns:minmax(0,1fr)}}

/* Защита и журналы */
#xbody{display:flex;flex-direction:column;gap:24px}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.jhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.tblw.j table{min-width:640px}
.tblw.j tbody tr{cursor:default}
.tblw.j tbody tr:hover td{background:transparent}
.tblw.j td.wrap{min-width:220px}
.jl{display:none;flex-direction:column}
.jl .it{min-height:48px}
.tm{width:52px;flex:none}
.pdk{font-weight:600}
#b_topic{display:flex}#b_topic button{flex:1;white-space:normal;height:auto;min-height:36px;padding:6px 10px;line-height:1.2}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.4;cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--okt)}
.pnote{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.pnote b{display:block;font-size:15px;overflow-wrap:anywhere}
.pnote #pv_b{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.pmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mu);margin-bottom:2px}
.pic{width:38px;height:38px;border-radius:9px;flex:none;background:#1A1B1F url(../icons/icon-192.png) center/cover no-repeat}
textarea.in{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.45}

/* Окна */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--bg);border-radius:22px;padding:22px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet h2{margin:0;font-size:20px}
.sheet p{margin:0;color:var(--mu);font-size:15px;line-height:1.45}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pr);color:var(--prf);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}

/* Вход */
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gbox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.gbox .brand{padding:0;font-size:18px;font-weight:700}
.gbox h1{margin:12px 0 0;font-size:30px;letter-spacing:-.02em}
.gbox p{margin:0;color:var(--mu);font-size:15px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu);font-weight:600}
.inp{height:54px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);padding:0 16px;font:inherit;font-size:19px;color:var(--fg);outline:none;width:100%}
.inp:focus{border-color:var(--fg)}
.gsmall{font-size:13px;color:var(--mu);text-align:center}

/* Телефон */
@media (max-width:899px){
  .side{display:none}
  .main{padding:16px 20px calc(96px + env(safe-area-inset-bottom));gap:16px}
  .ptop{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:6px}
  .ptop .big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .ptop .ttl{font-size:24px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ptop .back{font-size:30px;line-height:1;text-decoration:none;width:36px;height:44px;display:flex;align-items:center;background:none;border:0;padding:0;cursor:pointer}
  .dhead{display:none!important}
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:.5px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mu);text-decoration:none;position:relative;min-height:44px;justify-content:center}
  .tabs a.on{color:var(--fg);font-weight:600}
  .tabs svg{width:24px;height:24px}

  $('pw').focus();

function boot(){
  sb.auth.getSession().then(function(r){
    var s = r.data && r.data.session;
    if(!s || (s.user && s.user.is_anonymous)) return stepPhone();
    return sb.rpc('admin_state').then(function(r2){
      if(r2.error) { toast(r2.error.message); return stepPhone(); }
      var st = r2.data||{};
      if(!st.admin){
        gate('<h1>Нет доступа</h1><p>Этот номер не подключён к управлению.</p><button type="button" class="btn big" id="out">Выйти</button>');
        $('out').onclick = function(){ sb.auth.signOut().then(boot); };
        return;

function wordChip(w, ro){ return '<span class="wd" data-w="'+esc(w)+'">'+esc(w)+(ro?'':'<button type="button" aria-label="Убрать слово '+esc(w)+'">×</button>')+'</span>'; }
function bindCatEditor(d, c, homeN){
  if(!isOwner()) return;
  var f = $('cf'), wi = $('c_word');
  var dirty = function(){ A.dirty = true; };
  f.addEventListener('input', dirty); f.addEventListener('change', dirty);
  $('c_grp').onchange = function(){ var n = $('c_grp').value==='__new'; $('c_grp_new').hidden = !n; if(n) $('c_grp_new').focus(); dirty(); };
  bindSw('c_home', function(v){ dirty(); $('c_home_h').textContent = (v ? homeN + (c.on_home?0:1) : homeN - (c.on_home?1:0))+' из '+d.home_max+' мест'; });
  bindSw('c_act', dirty);
  function addWord(){
    var parts = wi.value.toLowerCase().split(/[\s,;]+/).map(function(w){ return w.replace(/[^a-z0-9а-яёҕҥөһү-]/g,''); }).filter(function(w){ return w.length>=2; });
    parts.forEach(function(w){ if(!f.querySelector('.wd[data-w="'+w+'"]')) wi.insertAdjacentHTML('beforebegin', wordChip(w)); });
    wi.value=''; if(parts.length) dirty();
  }
  wi.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===','){ e.preventDefault(); addWord(); }
    else if(e.key==='Backspace' && !wi.value){ var ws=f.querySelectorAll('.wd'); if(ws.length){ ws[ws.length-1].remove(); dirty(); } }
  });
  wi.addEventListener('blur', addWord);
  $('c_words').addEventListener('click', function(e){ var b=e.target.closest('.wd button'); if(b){ b.parentNode.remove(); dirty(); wi.focus(); } });
  $('c_cancel').onclick = function(){ A.dirty=false; if(c.id==null) location.hash='#dirs/cats'; else pageDirs('cats', String(c.id)); };
  f.addEventListener('submit', function(e){
    e.preventDefault(); addWord();
    var grp = $('c_grp').value==='__new' ? $('c_grp_new').value : $('c_grp').value;
    var sort = $('c_sort').value.trim();
    if(sort==='' && c.id==null){ var same = d.categories.filter(function(x){ return x.grp===grp; }); sort = same.length ? Math.max.apply(null, same.map(function(x){return x.sort;}))+10 : Math.max.apply(null, d.categories.map(function(x){return x.sort;}).concat([0]))+100; }
    if(!/^\d{1,4}$/.test(String(sort))) return toast(ERR.cat_sort);
    var body = { name:$('c_name').value, name_plural:$('c_plural').value, short_name:$('c_short').value, grp:grp, sort:Number(sort),
      on_home:swOn('c_home'), is_active:swOn('c_act'), keywords:[].map.call(f.querySelectorAll('.wd'), function(x){ return x.getAttribute('data-w'); }).join(' '),
      hint_service:$('c_hs').value, hint_unit:$('c_hu').value, hint_query:$('c_hq').value };
    var b = $('c_save'); b.disabled = true;
    rpc('admin_category_save', {p_id:c.id, p:body}).then(function(r){
      A.dirty = false; toast(c.id==null ? 'Сфера добавлена' : 'Сохранено');
      return loadDirs().then(function(){ if(c.id==null) location.hash = '#dirs/cats/'+r.id; else pageDirs('cats', String(c.id)); });
    }, function(err){ b.disabled = false; toast(err.message); });
  });
}

function renderBHist(items){

    if(x.stale) st.push('устарело '+num(x.stale));
    if(!x.total && x.devices) st.push('итоги уже очищены');
    return '<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(x.title)+'</div>'+
      '<div class="d" style="margin-top:2px;line-height:1.45">'+esc(x.body)+'</div>'+
      '<div class="d" style="margin-top:6px">'+esc(dmFull(x.created_at)+', '+hm(x.created_at)+' · '+bAudience(x)+' · '+num(x.devices)+' '+plural(x.devices,'мастер','мастера','мастеров'))+'</div>'+
      (st.length ? '<div class="d" style="margin-top:2px">'+esc(st.join(' · '))+'</div>' : '')+
      '</div><span class="chip gry">'+esc(bTopic(x.topic))+'</span></div>';
  }).join('');
}

/* ---------- Предложения от пользователей ---------- */
// Само прикреплено: роль, город, устройство, версия. Номера нет. Ответ и «сделано» — служебный push автору.
var IDK = {idea:'Идея', inconvenient:'Неудобно', broken:'Сломалось'};
var IDS = [['new','Новые'],['read','Прочитанные'],['done','Сделанные'],['rejected','Отклонённые']];
var IDS1 = {'new':'Новое', read:'Прочитано', done:'Сделано', rejected:'Отклонено'};
function idChip(x){ return '<span class="chip '+(x.kind==='broken'?'red':x.kind==='inconvenient'?'yel':'gry')+'">'+esc(IDK[x.kind]||x.kind)+'</span>'; }
function pageIdeas(id){
  A.idtab = A.idtab || 'new';
  var detail = !!id;
  function seg(counts){ return '<div class="seg" role="group" aria-label="Предложения">'+IDS.map(function(t){ var n = counts && counts[t[0]];
    return '<button type="button" data-it="'+t[0]+'" class="'+(A.idtab===t[0]?'on':'')+'" aria-pressed="'+(A.idtab===t[0])+'">'+t[1]+(n?' · '+n:'')+'</button>'; }).join('')+'</div>'; }
  shell('ideas', (detail ? '' : ptop('Предложения', '#more'))+
    '<div class="dhead" style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px"><div><h1 class="h1">Предложения</h1><div class="sub">Идеи и жалобы на работу приложения от вошедших по номеру · хранятся год</div></div><div id="isegA">'+seg()+'</div></div>'+
    (detail ? '' : '<div class="ponly" id="isegB" style="overflow-x:auto">'+seg().replace('class="seg"','class="seg" style="display:flex"')+'</div>')+
    '<div id="ibody"><div class="skel" style="height:320px"></div></div>');
  function bindSeg(){ document.querySelectorAll('[data-it]').forEach(function(b){ b.onclick = function(){ A.idtab = b.getAttribute('data-it'); if(location.hash==='#ideas') pageIdeas(null); else location.hash='#ideas'; }; }); }
  bindSeg();
  var v = location.hash;
  rpc('admin_ideas', {p_tab: detail ? 'all' : A.idtab, p_city: A.city}).then(function(res){
    if(location.hash!==v) return;
    $('isegA').innerHTML = seg(res.counts); var sb2=$('isegB'); if(sb2) sb2.innerHTML = seg(res.counts).replace('class="seg"','class="seg" style="display:flex"'); bindSeg();
    var all = res.items||[];
    var list = detail ? all.filter(function(x){ return x.status===A.idtab; }) : all;
    var cur = id ? all.filter(function(x){ return String(x.id)===String(id); })[0] : null;
    if(!cur && !id && window.matchMedia('(min-width:900px)').matches && list.length) cur = list[0];
    var nav = '<nav class="dlist" aria-label="Предложения">'+
      (list.length ? list.map(function(x){ var on = cur && cur.id===x.id;
        return '<a class="di'+(on?' on':'')+'" href="#ideas/'+x.id+'"'+(on?' aria-current="true"':'')+'><span style="min-width:0;display:flex;flex-direction:column"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap'+(x.status==='new'?';font-weight:600':'')+'">'+esc(x.body)+'</span><span class="d" style="font-weight:400">'+(x.role==='master'?'мастер':'заказчик')+(x.city?' · '+esc(x.city):'')+' · '+esc(dmy(x.created_at))+'</span></span><span class="tail">'+idChip(x)+'</span></a>'; }).join('')
        : '<div class="empty">'+({'new':'Новых предложений нет.', read:'Прочитанных нет.', done:'Сделанных пока нет.', rejected:'Отклонённых нет.'})[A.idtab]+'</div>')+'</nav>';
    var ed = cur ? ideaCard(cur) : (id ? '<section class="ed"><div class="empty">Предложение не найдено — возможно, удалено или старше года.</div></section>' : '');
    $('ibody').innerHTML = '<div class="split '+(detail?'detail':'list')+'">'+nav+ed+'</div>';
    if(cur) bindIdeaCard(cur);
    // открыли новое — отметить «прочитано» (без уведомления автору)
    if(cur && cur.status==='new') rpc('admin_idea_set', {p_id:cur.id, p_status:'read', p_reply:cur.reply}).then(function(){ cur.status='read'; loadBadges(); var st=$('id_st'); if(st) st.textContent = IDS1.read;
      var c = res.counts||{}; c['new'] = Math.max(0,(c['new']||0)-1); c.read = (c.read||0)+1; $('isegA').innerHTML = seg(c); var b2=$('isegB'); if(b2) b2.innerHTML = seg(c).replace('class="seg"','class="seg" style="display:flex"'); bindSeg(); }).catch(function(){});
  }).catch(function(err){ $('ibody').innerHTML='<div class="empty">'+esc(err.message)+'</div>'; });
}
function ideaCard(x){
  var owner = isOwner();
  return '<section class="ed" aria-label="Предложение">'+
    '<div class="ptop"><a class="back" href="#ideas" aria-label="Назад к предложениям">‹</a><b class="ttl">'+esc(IDK[x.kind]||'')+'</b><span class="logo" role="img" aria-label="Знак Уустары бул"></span></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 class="dhead" style="margin:0;font-size:24px;font-weight:700">'+esc(IDK[x.kind]||'')+'</h2><span class="d" id="id_st">'+esc(IDS1[x.status]||'')+'</span></div>'+
    '<div class="cmp"><div style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:15px">'+esc(x.body)+'</div></div>'+
    '<div class="rows">'+
      '<div class="row"><span style="flex:1" class="d">Автор</span><span>'+(x.profile_id ? 'мастер <a href="#masters/'+x.profile_id+'" style="font-weight:600">'+esc(x.name||'')+'</a>' : 'заказчик')+'</span></div>'+
      '<div class="row"><span style="flex:1" class="d">Город</span><span>'+esc(x.city||'—')+'</span></div>'+
      '<div class="row"><span style="flex:1" class="d">Устройство</span><span>'+esc(x.device||'—')+(x.app_version?' · версия '+esc(x.app_version):'')+'</span></div>'+
      '<div class="row"><span style="flex:1" class="d">Получено</span><span>'+esc(dmy(x.created_at))+'</span></div>'+
      (x.pd_request_id ? '<div class="row"><span style="flex:1" class="d">Запрос по ПДн</span><a href="#security/pd/'+x.pd_request_id+'" style="font-weight:600">№ '+x.pd_request_id+' ›</a></div>' : '')+
    '</div>'+
    '<span class="lbl">Статус</span><div class="seg" role="radiogroup" aria-label="Статус" id="id_seg" style="display:flex;flex-wrap:wrap">'+IDS.slice(1).map(function(t){ return '<button type="button" role="radio" data-is="'+t[0]+'" class="'+(x.status===t[0]||(x.status==='new'&&t[0]==='read')?'on':'')+'" aria-checked="'+(x.status===t[0]||(x.status==='new'&&t[0]==='read'))+'">'+esc(IDS1[t[0]])+'</button>'; }).join('')+'</div>'+
    '<label class="fl"><span>Ответ автору <small id="id_rc">'+String(x.reply||'').length+' / 500</small></span><textarea class="in" id="id_reply" maxlength="500" rows="3" placeholder="Коротко и по делу — автор увидит в «Моих предложениях»">'+esc(x.reply||'')+'</textarea></label>'+
    '<div class="d" style="line-height:1.5;font-size:13px">Если ответ новый или статус «Сделано», автору придёт уведомление (у кого они включены). Только ответ на его сообщение — без рекламы.</div>'+
    '<div class="acts"><button type="button" class="btn pr" id="id_save">Сохранить</button>'+
      (owner && !x.pd_request_id ? '<button type="button" class="btn" id="id_pd">Сделать запросом по ПДн</button>' : '')+
      (owner ? '<button type="button" class="btn dg" id="id_del">Удалить</button>' : '')+'</div>'+
    '</section>';
}
function bindIdeaCard(x){
  var st = x.status==='new' ? 'read' : x.status, ta = $('id_reply');
  A.dirty = false;
  document.querySelectorAll('[data-is]').forEach(function(b){ b.onclick = function(){
    st = b.getAttribute('data-is'); A.dirty = true;
    document.querySelectorAll('[data-is]').forEach(function(y){ var on = y===b; y.classList.toggle('on', on); y.setAttribute('aria-checked', on); }); }; });
  ta.addEventListener('input', function(){ A.dirty = true; $('id_rc').textContent = ta.value.length+' / 500'; });
  $('id_save').onclick = function(){ var b=$('id_save'); b.disabled=true;
    rpc('admin_idea_set', {p_id:x.id, p_status:st, p_reply:ta.value}).then(function(r){
      A.dirty = false; toast(r.push ? 'Сохранено · автору ушло уведомление' : 'Сохранено'); loadBadges();
      if(st!==A.idtab) A.idtab = st;
      pageIdeas(String(x.id));
    }, function(err){ b.disabled=false; toast(err.message); }); };
  var pd = $('id_pd'); if(pd) pd.onclick = function(){
    sheet('<h2>Сделать запросом по ПДн</h2><p>Запишем в реестр «Защита и журналы → Запросы по ПДн»: дата получения — день отправки ('+esc(dmy(x.created_at))+'), заявитель — аккаунт автора. Срок ответа посчитается сам.</p>'+
      '<label class="fl"><span>Что просят</span><select class="in" id="id_pk"><option value="">Выберите</option>'+['access','correct','delete','withdraw','stop','other'].map(function(k){ return '<option value="'+k+'">'+esc(PDK[k])+'</option>'; }).join('')+'</select></label>'+
      '<p id="id_ph" class="d" style="font-size:13px;min-height:18px"></p>'+
      '<button type="button" class="btn big pr" id="id_pok">Записать</button><button type="button" class="btn big" data-close>Отмена</button>',
      function(){ var k=$('id_pk'); k.onchange = function(){ $('id_ph').textContent = PDH[k.value]||''; };
        $('id_pok').onclick = function(){ if(!k.value) return toast('Выберите, что просят'); var b=$('id_pok'); b.disabled=true;
          rpc('admin_idea_to_pd', {p_id:x.id, p_kind:k.value}).then(function(r){ closeSheet(); toast('Записано · срок '+dmd(r.due_on)); loadBadges(); location.hash = '#security/pd/'+r.id; },
            function(err){ b.disabled=false; toast(err.message); }); }; });
  };
  var d = $('id_del'); if(d) d.onclick = function(){ confirmBox('Удалить предложение?', 'Автор тоже перестанет его видеть. Вернуть нельзя.', 'Удалить', true, function(){
    rpc('admin_idea_delete', {p_id:x.id}).then(function(){ A.dirty=false; toast('Удалено'); loadBadges(); location.hash = '#ideas'; }, function(err){ toast(err.message); }); }); };
}

/* ---------- Ещё (телефон) ---------- */
function pageMore(){
  if(window.matchMedia('(min-width:900px)').matches){ location.hash='#overview'; return; }
  shell('more', ptop('Ещё')+
    '<div class="grp" style="padding:8px 14px">'+citySelect('city2')+'</div>'+
    '<div class="grp"><a class="it" href="#reviews" style="min-height:48px">'+ic('compl')+'<span style="flex:1">Новые отзывы</span><span class="d"><span id="rvn">'+(A.badges.reviews_new||0)+'</span> ›</span></a>'+
    '<a class="it" href="#dirs" style="min-height:48px">'+ic('dir')+'<span style="flex:1">Справочники</span><span class="d">›</span></a>'+
    '<a class="it" href="#broadcast" style="min-height:48px">'+ic('bell')+'<span style="flex:1">Рассылка</span><span class="d">›</span></a>'+
    '<a class="it" href="#ideas" data-idn style="min-height:48px">'+ic('idea')+'<span style="flex:1">Предложения</span>'+(A.badges.ideas_new?'<span class="badge">'+A.badges.ideas_new+'</span>':'')+'<span class="d" style="margin-left:8px">›</span></a>'+
    '<a class="it" href="#settings" style="min-height:48px">'+ic('set')+'<span style="flex:1">Настройки</span><span class="d">›</span></a>'+
    '<a class="it" href="#security" data-pdu style="min-height:48px">'+ic('shield')+'<span style="flex:1">Защита и журналы</span><span class="d" style="margin-left:8px">›</span></a>'+
    LATER.map(function(n){ return '<div class="it" style="min-height:48px;color:var(--mu)">'+ic(n[1])+'<span style="flex:1">'+n[0]+'</span><span class="chip gry">'+n[2]+'</span></div>'; }).join('')+'</div>'+
    '<span class="lbl">Оформление</span>'+themeSeg('')+
    '<div class="grp"><a class="it" href="../" target="_blank" rel="noopener" style="min-height:48px"><span style="flex:1">Открыть приложение</span><span class="d">›</span></a>'+
    '<button type="button" class="it" data-act="pw" style="min-height:48px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer"><span style="flex:1">Сменить пароль</span><span class="d">›</span></button>'+
    '<button type="button" class="it" data-act="lock" style="min-height:48px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:var(--dgt);font-weight:600"><span style="flex:1">Выйти из управления</span></button>'+
    '<div class="it" style="min-height:48px"><span class="d" style="flex:1">'+esc(A.me.phone||'')+' · '+(A.me.role==='owner'?'владелец':'модератор')+'</span></div></div>');
  var c=$('city2'); if(c) c.onchange = function(){ setCity(c.value); };
  document.querySelector('#main .seg').style.display='flex';
}

sb.auth.onAuthStateChange(function(ev){ if(ev==='SIGNED_OUT' && A.me){ A.me=null; boot(); } });
boot();
})();
</script>
