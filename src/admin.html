<html lang="ru">

<title>Управление · Уустары бул</title>

<style>
/* Управление «Уустары бул» — оформление как в макете админки (14.10.2026): цвета и шрифт приложения, две темы */
:root{--bg:#FFFFFF;--fg:#0B0C0E;--mu:#6B7079;--sf:#F4F4F6;--pl:#EFEFF2;--ln:#E5E5EA;--ln2:#EFEFF2;--side:#F7F7F9;--card:#FFFFFF;--pr:#0B0C0E;--prf:#FFFFFF;--segon:#FFFFFF;--v:#3F434A;--off:#C4C7CD;--okt:#1A8048;--dgt:#B42318;--dgl:#F3C5C5;--rb:#FDECEC;--rf:#8A1C1C;--yb:#FFF1C2;--yf:#5C4200;--gb:#E3F3EA;--gf:#14653A;--nb:#E5E5EA;--nf:#3F434A;--star:#E0A11B;--warn:#9A5B00;--sh:0 1px 2px rgba(0,0,0,.08);--scrim:rgba(0,0,0,.35);color-scheme:light}
:root[data-theme="dark"]{--bg:#1A1B1F;--fg:#F5F5F7;--mu:#9499A3;--sf:#24262B;--pl:#2A2C31;--ln:#2E3035;--ln2:#2A2C31;--side:#202226;--card:#2A2C31;--pr:#F5F5F7;--prf:#1A1B1F;--segon:#3A3D43;--v:#CACED4;--off:#4A4E55;--okt:#3DD17D;--dgt:#FF6B6F;--dgl:#5A2E30;--rb:#33201F;--rf:#F2C4C6;--yb:#4A3B12;--yf:#F7E2A6;--gb:#1E3A2A;--gf:#8FE3B1;--nb:#3A3D43;--nf:#CACED4;--star:#F2B84B;--warn:#F2B84B;--sh:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1B1F;--fg:#F5F5F7;--mu:#9499A3;--sf:#24262B;--pl:#2A2C31;--ln:#2E3035;--ln2:#2A2C31;--side:#202226;--card:#2A2C31;--pr:#F5F5F7;--prf:#1A1B1F;--segon:#3A3D43;--v:#CACED4;--off:#4A4E55;--okt:#3DD17D;--dgt:#FF6B6F;--dgl:#5A2E30;--rb:#33201F;--rf:#F2C4C6;--yb:#4A3B12;--yf:#F7E2A6;--gb:#1E3A2A;--gf:#8FE3B1;--nb:#3A3D43;--nf:#CACED4;--star:#F2B84B;--warn:#F2B84B;--sh:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--fg)}a:hover{color:var(--v)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.logo{display:inline-block;flex:none;width:44px;height:32px;background:var(--fg);-webkit-mask:url(../icons/logo-mark.webp) center/contain no-repeat;mask:url(../icons/logo-mark.webp) center/contain no-repeat}
.d{font-size:13px;color:var(--mu)}
.h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:15px;color:var(--mu);margin-top:4px}
.h2{margin:0;font-size:20px;font-weight:700}
.up{color:var(--okt);font-weight:600}.down{color:var(--dgt);font-weight:600}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.red{background:var(--rb);color:var(--rf)}.yel{background:var(--yb);color:var(--yf)}.grn{background:var(--gb);color:var(--gf)}.gry{background:var(--nb);color:var(--nf)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:20px;background:var(--card);border:1px solid var(--ln);font-size:14px;font-weight:600;color:var(--fg);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--off);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pr{background:var(--pr);color:var(--prf);border-color:var(--pr)}
.btn.dg{color:var(--dgt);border-color:var(--dgl)}
.btn.sm{min-height:34px;padding:0 13px;border-radius:17px;font-size:13px}
.btn.big{min-height:52px;border-radius:16px;font-size:16px;width:100%}
.link{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:var(--pl);border-radius:12px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--segon);box-shadow:var(--sh);font-weight:600}
.seg.sm{display:flex}.seg.sm button{flex:1;height:30px;padding:0 4px;font-size:12px}
.f{height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--pl);font-size:14px;cursor:pointer;white-space:nowrap}
.f.on{background:var(--pr);color:var(--prf);font-weight:600}
.ava{width:40px;height:40px;border-radius:12px;color:#FFFFFF;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.skel{background:var(--sf);border-radius:20px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.empty{padding:28px 16px;text-align:center;color:var(--mu);font-size:15px}

/* Оболочка: компьютер — меню слева; телефон — вкладки внизу */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{flex:0 0 260px;padding:24px 16px;background:var(--side);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.main{flex:1;min-width:0;padding:32px 40px 48px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav span.na{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:15px;font-weight:500;text-decoration:none;color:var(--fg)}
.nav a:hover{background:var(--pl);color:var(--fg)}
.nav a.on{background:var(--pr);color:var(--prf)}
.nav span.na{color:var(--mu);cursor:default}
.nav svg{width:20px;height:20px;flex:none}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#C62828;color:#FFFFFF;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.cnt{margin-left:auto;font-size:13px;color:var(--mu);white-space:nowrap;padding-left:6px}
.on .cnt{color:var(--off)}
.foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--mu)}
.citysel{position:relative;display:block}
.citysel select{appearance:none;-webkit-appearance:none;width:100%;height:44px;padding:0 36px 0 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.citysel:after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.tabs{display:none}
.ptop{display:none}

/* Обзор */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--sf);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.k{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.v{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card{background:var(--sf);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln);text-decoration:none;color:var(--fg)}
.rows>.row:first-child{border-top:0}
a.row:hover{color:var(--fg)}
.chart{height:180px;display:flex;align-items:flex-end;gap:10px}
.chart.many{gap:3px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar>div{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:150px}
.bar i{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--fg);min-height:2px}
.bar i.s{background:var(--off)}
.bar span{font-size:11px;color:var(--mu);height:14px}
.legend{display:flex;gap:16px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Мастера */
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.grow{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.srch{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:var(--sf);min-width:280px;color:var(--mu)}
.srch input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-size:15px;color:var(--fg)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.tblw{overflow-x:auto;border:1px solid var(--ln);border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);padding:10px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--ln2);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sf)}
tr.sel td{background:var(--sf)}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:160px}
.who{display:flex;align-items:center;gap:12px}
.split.detail table{min-width:0}
.split.detail .opt{display:none}
.box .d{display:block;font-size:12px;line-height:1.3}
.mlist{display:none}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:.5px solid var(--ln);text-decoration:none;color:var(--fg)}
.it:first-child{border-top:0}
.nm{font-weight:600}
.panel{flex:1 1 340px;min-width:0;max-width:440px;padding:22px;border-radius:22px;background:var(--sf);display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
.panel.wide{max-width:none}
.box{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}
.box b{display:block;font-size:18px}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--ln)}
.ln{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* Жалобы */
.queue{flex:1 1 300px;max-width:380px;display:flex;flex-direction:column;gap:4px}
.q{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;text-align:left;background:transparent;border:0;cursor:pointer;width:100%;text-decoration:none;color:var(--fg)}
.q:hover{background:var(--pl);color:var(--fg)}
.q.on{background:var(--sf)}
.qt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.case{flex:999 1 480px;min-width:0;border-radius:22px;background:var(--sf);padding:22px;display:flex;flex-direction:column;gap:16px}
.cmp{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.alert{background:var(--rb);color:var(--rf);border-radius:14px;padding:12px 14px;font-size:14px}
.note{background:var(--yb);color:var(--yf);border-radius:14px;padding:12px 14px;font-size:14px}
.rvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rv{border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rv p{margin:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.star{color:var(--star);letter-spacing:1px}
.warn{color:var(--warn);font-weight:600}

/* Окна */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--bg);border-radius:22px;padding:22px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet h2{margin:0;font-size:20px}
.sheet p{margin:0;color:var(--mu);font-size:15px;line-height:1.45}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pr);color:var(--prf);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}

/* Вход */
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gbox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.gbox .brand{padding:0;font-size:18px;font-weight:700}
.gbox h1{margin:12px 0 0;font-size:30px;letter-spacing:-.02em}
.gbox p{margin:0;color:var(--mu);font-size:15px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu);font-weight:600}
.inp{height:54px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);padding:0 16px;font:inherit;font-size:19px;color:var(--fg);outline:none;width:100%}
.inp:focus{border-color:var(--fg)}
.gsmall{font-size:13px;color:var(--mu);text-align:center}

/* Телефон */
@media (max-width:899px){
  .side{display:none}
  .main{padding:16px 20px calc(96px + env(safe-area-inset-bottom));gap:16px}
  .ptop{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:6px}
  .ptop .big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .ptop .ttl{font-size:24px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ptop .back{font-size:30px;line-height:1;text-decoration:none;width:36px;height:44px;display:flex;align-items:center;background:none;border:0;padding:0;cursor:pointer}
  .dhead{display:none!important}
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:.5px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mu);text-decoration:none;position:relative;min-height:44px;justify-content:center}
  .tabs a.on{color:var(--fg);font-weight:600}
  .tabs svg{width:24px;height:24px}
  .dot{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#C62828;color:#FFFFFF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:14px 16px;border-radius:18px}
  .v{font-size:26px}
  .cards3,.rvs{grid-template-columns:minmax(0,1fr)}
  .chart{height:150px;gap:6px}.bar>div{height:120px}
  .srch{min-width:0;width:100%}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin-right:-20px;padding-right:20px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .tblw{display:none}
  .mlist{display:flex;flex-direction:column}
  .panel{max-width:none;position:static;padding:0;background:transparent;gap:14px}
  .box{background:var(--sf)}
  .grp{background:var(--sf);border-radius:16px;padding:0 14px;display:flex;flex-direction:column}
  .queue{max-width:none}
  .case{padding:0;background:transparent}
  .cmp{background:var(--sf)}
  .split.detail>.grow,.split.detail>.queue{display:none}
  .split.list>.panel,.split.list>.case{display:none}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:22px 22px 0 0;max-width:none;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
}
@media (min-width:900px){ .ponly{display:none!important} }
@media (min-width:900px) and (max-width:1199px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .cards3{grid-template-columns:minmax(0,1fr)} .rvs{grid-template-columns:repeat(2,minmax(0,1fr))} .main{padding:28px 28px 40px} }
</style>
</head>

  if(m<1){ if(days<14) return days+' '+plural(days,'день','дня','дней'); return Math.floor(days/7)+' нед.'; }
  var y=Math.floor(m/12), mm=m%12;
  if(!y) return mm+' мес.';
  return y+' '+plural(y,'год','года','лет')+(mm?' и '+mm+' мес.':'');
}

    '<button type="button" class="link gsmall" id="out">Выйти — другой номер</button>'+
    (first ? '' : '<p class="gsmall">Забыли пароль? Владелец сбрасывает его в SQL-редакторе: <code>select admin_grant(\'номер\')</code> — потом придумать новый здесь.</p>'));
  $('pw').focus();

      if(p!==$('pw2').value) return toast('Пароли не совпадают');

      toast(d.left!=null ? 'Неверный пароль. Осталось попыток: '+d.left : 'Не получилось');
    });
  });
}

  sb.auth.getSession().then(function(r){
    var s = r.data && r.data.session;
    if(!s || (s.user && s.user.is_anonymous)) return stepPhone();
    return sb.rpc('admin_state').then(function(r2){
      if(r2.error) { toast(r2.error.message); return stepPhone(); }
      var st = r2.data||{};
      if(!st.admin){
        gate('<h1>Нет доступа</h1><p>Этот номер не подключён к управлению.</p><button type="button" class="btn big" id="out">Выйти</button>');
        $('out').onclick = function(){ sb.auth.signOut().then(boot); };
        return;
      }
      if(!st.unlocked) return stepPassword(st);
      A.me = st;
      return sb.from('cities').select('id,name').order('sort').then(function(c){
        A.cities = c.data||[];
        if(A.city!=null && !A.cities.some(function(x){return x.id===A.city;})) A.city=null;
        route();
      });
    });
  });
}

    return '<button type="button" data-ct="'+t[0]+'" class="'+(A.ctab===t[0]?'on':'')+'" aria-pressed="'+(A.ctab===t[0])+'">'+t[1]+n+'</button>'; }).join('')+'</div>';
  shell('complaints', (detail ? '' : ptop(A.ctab==='open'?'Жалобы':'Отзывы', null, cityName()))+
    '<div class="dhead" style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px"><div><h1 class="h1">Жалобы и отзывы</h1><div class="sub">Карточка скрывается сама после 3 жалоб от разных людей. Здесь — то, что требует вашего решения.</div></div>'+seg+'</div>'+
    (detail?'':'<div class="ponly">'+seg.replace('class="seg"','class="seg" style="display:flex"')+'</div>')+
    '<div id="cbody"><div class="skel" style="height:320px"></div></div>');
  document.querySelectorAll('[data-ct]').forEach(function(x){ x.onclick = function(){ A.ctab = x.getAttribute('data-ct'); if(location.hash==='#complaints') pageComplaints(null); else location.hash='#complaints'; }; });
  var v = location.hash;
  if(A.ctab==='open') return rpc('admin_complaints',{p_city:A.city, p_tab:'open'}).then(function(q){ if(location.hash===v) renderQueue(q||[], id); }).catch(function(err){ $('cbody').innerHTML='<div class="empty">'+esc(err.message)+'</div>'; });
  if(A.ctab==='resolved') return rpc('admin_complaints',{p_city:A.city, p_tab:'resolved'}).then(function(r){ if(location.hash===v) renderResolved(r||[]); }).catch(function(err){ toast(err.message); });
  return rpc('admin_reviews',{p_city:A.city, p_tab:A.ctab==='hidden'?'hidden':'new'}).then(function(r){ if(location.hash===v) renderReviews(r||[]); }).catch(function(err){ toast(err.message); });
}
function qChip(g){ return g.any_hidden ? '<span class="chip red">Скрыто</span>' : '<span class="chip '+(g.max_authors>=2?'yel':'gry')+'">'+g.max_authors+' из 3</span>'; }
function renderQueue(q, id){
  if(!q.length){ $('cbody').innerHTML = '<div class="empty">Жалоб без решения нет.</div>'; return; }
  if(!id && window.matchMedia('(min-width:900px)').matches) id = q[0].id;
  var g = q.filter(function(x){ return x.id===id; })[0];
  if(id && !g){ $('cbody').innerHTML = '<div class="empty">Жалобы на этого мастера уже разобраны. <a href="#complaints">К очереди</a></div>'; return; }
  var detail = !!(location.hash.split('/')[1]);
  var queue = '<div class="queue" aria-label="Очередь">'+q.map(function(x){
    var it=x.items||[], days=Math.max(1, Math.round((new Date(x.last_at)-new Date(x.first_at))/864e5));
    var rs=[]; it.forEach(function(c){ var t='«'+(REASON[c.reason]||c.reason).toLowerCase()+'»'; if(rs.indexOf(t)<0) rs.push(t); });
    var tt=[]; it.forEach(function(c){ var t=c.target_type==='sphere'?c.target_title:c.target_type==='profile'?'профиль':'отзыв'; if(tt.indexOf(t)<0) tt.push(t); });
    return '<a class="q'+(x.id===id?' on':'')+'" href="#complaints/'+x.id+'"'+(x.id===id?' aria-current="true"':'')+'>'+ava(x)+'<div style="flex:1;min-width:0"><div class="qt"><b>'+esc(x.name)+' · '+esc(tt.join(', '))+'</b>'+qChip(x)+'</div>'+
      '<div class="d">'+it.length+' '+plural(it.length,'жалоба','жалобы','жалоб')+(it.length>1?' за '+days+' '+plural(days,'день','дня','дней'):'')+' · '+esc(rs.join(', '))+'</div></div></a>'; }).join('')+'</div>';
  var cs = g ? caseHtml(g) : '';
  $('cbody').innerHTML = '<div class="split '+(detail?'detail':'list')+'">'+queue+cs+'</div>';
  if(g) bindCase(g);
}
function caseHtml(g){
  var it = g.items||[], targets = {};
  it.forEach(function(c){ targets[c.target_type+':'+c.target_id] = c; });
  var multi = Object.keys(targets).length>1;
  var hiddenT = Object.keys(targets).map(function(k){ return targets[k]; }).filter(function(c){ return c.target_hidden; });
  var when = g.hidden_at ? ' '+dmFull(g.hidden_at) : '';
  var what = hiddenT.map(function(c){ return c.target_type==='profile' ? 'Профиль скрыт автоматически'+when : c.target_type==='sphere' ? 'Карточка «'+c.target_title+'» скрыта автоматически'+when : c.target_title+' скрыт'; }).join('. ');
  return '<section class="case" aria-label="Жалобы на мастера">'+
    '<div class="ptop"><a class="back" href="#complaints" aria-label="Назад к жалобам">‹</a><b class="ttl">Жалобы · '+esc(g.name)+'</b><span class="logo" role="img" aria-label="Знак Уустары бул"></span></div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between"><div style="display:flex;gap:14px;align-items:center;min-width:0">'+ava(g,56,16)+
      '<div style="min-width:0"><div style="font-size:20px;font-weight:700">'+esc(g.name)+'</div><div class="d">'+esc((g.spheres||'Без направлений')+' · '+g.city)+(g.reviews?' · '+rate(g.rating)+' ★, '+g.reviews+' '+plural(g.reviews,'отзыв','отзыва','отзывов'):'')+' · с нами '+withUs(g.since)+'</div></div></div>'+
      '<a class="btn sm" href="#masters/'+g.id+'">Карточка мастера ›</a></div>'+
    (g.blocked_at ? '<div class="alert">Мастер заблокирован.</div>' : hiddenT.length ? '<div class="alert">'+esc(what)+'. Мастеру пришло уведомление.</div>' : '')+
    '<span class="lbl">Жалобы</span>'+
    it.map(function(c){
      return '<div class="cmp"><div class="qt"><b>'+esc(REASON[c.reason]||c.reason)+'</b><span class="d">'+dm(c.created_at)+'</span></div>'+
        (multi||c.target_type!=='sphere' ? '<div class="d">На: '+esc(c.target_title||'')+'</div>' : '')+
        '<div style="font-size:14px;overflow-wrap:anywhere">'+(c.comment?esc(c.comment):'<span class="d">Без текста</span>')+'</div>'+
        '<div class="qt" style="align-items:center"><div class="d">Заказчик ··'+esc(c.author_tail||'??')+' · '+(c.contacted_at?'звонил мастеру '+dm(c.contacted_at):'не звонил через приложение')+
          (c.same_day?' · <span class="warn">аккаунт создан в тот же день</span>':'')+'</div>'+
          (it.length>1?'<button type="button" class="btn sm" data-rej="'+c.id+'">Отклонить</button>':'')+'</div></div>'; }).join('')+
    '<div class="acts" style="padding-top:4px">'+
      (g.blocked_at ? '<button type="button" class="btn pr" data-dec="dismiss">Закрыть жалобы</button>'
       : hiddenT.length ? '<button type="button" class="btn pr" data-dec="restore">Вернуть</button><button type="button" class="btn" data-dec="uphold">Оставить скрытым</button>'
       : '<button type="button" class="btn pr" data-dec="dismiss">Отклонить жалобы</button><button type="button" class="btn" data-dec="uphold">Скрыть</button>')+
      (g.blocked_at ? '' : '<button type="button" class="btn dg" data-dec="block">Заблокировать мастера</button>')+'</div>'+
    '<span class="d">Решение пишется в историю мастера. Авторы жалоб решения не видят.</span></section>';
}
function bindCase(g){
  var T = { restore:['Вернуть?','Скрытое снова появится в поиске, мастеру придёт уведомление. Жалобы закроются как отклонённые.','Вернуть',false],
    uphold:['Скрыть и закрыть жалобы?','То, на что жаловались, будет скрыто из поиска (если ещё не скрыто). Мастеру придёт уведомление.','Скрыть',true],
    dismiss:['Отклонить жалобы?','Ничего не скрывается, жалобы закрываются. Новые жалобы будут считаться заново.','Отклонить',false],
    block:['Заблокировать мастера?','Профиль и все направления пропадут из поиска. Все жалобы закроются как принятые.','Заблокировать',true] };
  document.querySelectorAll('[data-dec]').forEach(function(b){ b.onclick = function(){ var d=b.getAttribute('data-dec'), t=T[d];
    confirmBox(t[0], t[1], t[2], t[3], function(){
      var call = d==='block' ? rpc('admin_master_action',{p_id:g.id, p_action:'block'}) : rpc('admin_complaints_decide',{p_profile:g.id, p_decision:d});
      call.then(function(){ toast('Готово'); loadBadges(); location.hash = '#complaints'; if(location.hash==='#complaints') pageComplaints(null); }, function(err){ toast(err.message); });
    }); }; });
  document.querySelectorAll('[data-rej]').forEach(function(b){ b.onclick = function(){
    confirmBox('Отклонить эту жалобу?', 'Она перестанет учитываться. Остальные жалобы останутся в очереди.', 'Отклонить', false, function(){
      rpc('admin_complaints_decide',{p_profile:g.id, p_decision:'reject_one', p_complaint:Number(b.getAttribute('data-rej'))}).then(function(){ toast('Готово'); loadBadges(); pageComplaints(g.id); }, function(err){ toast(err.message); }); }); }; });
}
function renderReviews(r){
  var hidden = A.ctab==='hidden';
  var REAS = {insult:'оскорбление', spam:'спам', complaints:'после жалоб'};
  $('cbody').innerHTML = '<div class="d" style="margin-bottom:12px">'+(hidden?'Скрытые отзывы не видны заказчикам и не влияют на рейтинг.':'Отзывы за 30 дней. Публикуются сразу; скрыть можно только оскорбление или спам.')+'</div>'+
    (r.length ? '<div class="rvs">'+r.map(function(x){
      return '<div class="rv"><div class="qt"><b style="overflow-wrap:anywhere">'+esc(x.title||'Без заголовка')+'</b><span class="star" role="img" aria-label="'+x.rating+' из 5">'+stars(x.rating)+'</span></div>'+
        (x.body?'<p>'+esc(x.body)+'</p>':'')+
        '<div class="d"><a href="#masters/'+x.profile_id+'">'+esc(x.name)+'</a> · от '+esc(x.author_name)+' · '+dm(x.created_at)+(x.is_hidden?' · <span class="chip red">скрыт: '+esc(REAS[x.hidden_reason]||'')+'</span>':'')+'</div>'+
        (x.is_hidden ? '<button type="button" class="btn sm" style="align-self:flex-start" data-rshow="'+x.id+'">Вернуть</button>'
                     : '<button type="button" class="btn sm" style="align-self:flex-start" data-rhide="'+x.id+'">Скрыть</button>')+'</div>'; }).join('')+'</div>'
      : '<div class="empty">'+(hidden?'Скрытых отзывов нет.':'Новых отзывов нет.')+'</div>');
  $('cbody').querySelectorAll('[data-rhide]').forEach(function(b){ b.onclick = function(){ var id=b.getAttribute('data-rhide');
    sheet('<h2>Скрыть отзыв?</h2><p>Скрыть можно только оскорбление или спам. Рейтинг мастера пересчитается.</p>'+
      '<button type="button" class="btn big dg" data-why="insult">Оскорбление</button><button type="button" class="btn big dg" data-why="spam">Спам или реклама</button><button type="button" class="btn big" data-close>Отмена</button>',
      function(s){ s.querySelectorAll('[data-why]').forEach(function(w){ w.onclick=function(){ closeSheet();
        rpc('admin_review_action',{p_id:id, p_action:'hide', p_reason:w.getAttribute('data-why')}).then(function(){ toast('Отзыв скрыт'); loadBadges(); pageComplaints(null); }, function(err){ toast(err.message); }); }; }); }); }; });
  $('cbody').querySelectorAll('[data-rshow]').forEach(function(b){ b.onclick = function(){
    rpc('admin_review_action',{p_id:b.getAttribute('data-rshow'), p_action:'show'}).then(function(){ toast('Отзыв возвращён'); loadBadges(); pageComplaints(null); }, function(err){ toast(err.message); }); }; });
}
function renderResolved(r){
  $('cbody').innerHTML = r.length ? '<div class="rows">'+r.map(function(c){
    return '<div class="row">'+ava(c)+'<div style="flex:1;min-width:0"><div style="font-weight:600"><a href="#masters/'+c.profile_id+'" style="text-decoration:none">'+esc(c.name)+'</a> · '+esc(c.target_title||'')+'</div>'+
      '<div class="d">'+esc(REASON[c.reason]||c.reason)+(c.comment?' · «'+esc(c.comment.length>80?c.comment.slice(0,80)+'…':c.comment)+'»':'')+' · жалоба '+dm(c.created_at)+', решено '+dm(c.resolved_at)+'</div></div>'+
      (c.decision==='upheld'?'<span class="chip red">Принята</span>':'<span class="chip gry">Отклонена</span>')+'</div>'; }).join('')+'</div>'
    : '<div class="empty">Решённых жалоб пока нет.</div>';
}

/* ---------- Ещё (телефон) ---------- */
function pageMore(){
  if(window.matchMedia('(min-width:900px)').matches){ location.hash='#overview'; return; }
  shell('more', ptop('Ещё')+
    '<div class="grp" style="padding:8px 14px">'+citySelect('city2')+'</div>'+
    '<div class="grp"><a class="it" href="#reviews" style="min-height:48px">'+ic('compl')+'<span style="flex:1">Новые отзывы</span><span class="d"><span id="rvn">'+(A.badges.reviews_new||0)+'</span> ›</span></a>'+
    LATER.map(function(n){ return '<div class="it" style="min-height:48px;color:var(--mu)">'+ic(n[1])+'<span style="flex:1">'+n[0]+'</span><span class="chip gry">'+n[2]+'</span></div>'; }).join('')+'</div>'+
    '<span class="lbl">Оформление</span>'+themeSeg('')+
    '<div class="grp"><a class="it" href="../" target="_blank" rel="noopener" style="min-height:48px"><span style="flex:1">Открыть приложение</span><span class="d">›</span></a>'+
    '<button type="button" class="it" data-act="pw" style="min-height:48px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer"><span style="flex:1">Сменить пароль</span><span class="d">›</span></button>'+
    '<button type="button" class="it" data-act="lock" style="min-height:48px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:var(--dgt);font-weight:600"><span style="flex:1">Выйти из управления</span></button>'+
    '<div class="it" style="min-height:48px"><span class="d" style="flex:1">'+esc(A.me.phone||'')+' · '+(A.me.role==='owner'?'владелец':'модератор')+'</span></div></div>');
  var c=$('city2'); if(c) c.onchange = function(){ setCity(c.value); };
  document.querySelector('#main .seg').style.display='flex';
}

sb.auth.onAuthStateChange(function(ev){ if(ev==='SIGNED_OUT' && A.me){ A.me=null; boot(); } });
boot();
})();
</script>
