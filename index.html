<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Уустары бул</title>
<meta name="description" content="Местные мастера вашего города: сантехники, электрики, сварщики, репетиторы и другие.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Уустары бул">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Стиль App Store из макетов: крупные заголовки, пилюли, белый/графитовый фон, зелёный «Позвонить» */
:root{
  --bg:#FFFFFF; --fg:#0B0C0E; --mu:#6B7079; --sf:#F4F4F6; --pl:#EFEFF2; --ln:#E5E5EA; --v:#3F434A;
  --pr:#0B0C0E; --prf:#FFFFFF; --call:#1A8048; --callf:#FFFFFF; --callt:#1A8048;
  --dg:#C62828; --dgb:#FDECEC; --dgt:#8A1C1C; --wc:#2D4A3E; --wcd:#4C6A5C; --qt:#D1D1D6;
  --scrim:rgba(0,0,0,.35); --sheet:#FFFFFF; --segon:#FFFFFF;
  --ok:#1A8048; --warn:#9A5B00; --star:#E0A11B; --staroff:#C4C7CD; --trk:#E1E1E6; --dash:#B8BBC2;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1B1F; --fg:#F5F5F7; --mu:#9499A3; --sf:#24262B; --pl:#2A2C31; --ln:#2E3035; --v:#CACED4;
  --pr:#F5F5F7; --prf:#1A1B1F; --call:#2DBE6C; --callf:#04200F; --callt:#3DD17D;
  --dg:#FF6B6F; --dgb:#33201F; --dgt:#F2C4C6; --wc:#1F2E28; --wcd:#344D42; --qt:#42454B;
  --scrim:rgba(0,0,0,.6); --sheet:#202226; --segon:#3A3D43;
  --ok:#3DD17D; --warn:#F2B84B; --star:#F2B84B; --staroff:#4A4E55; --trk:#3A3D43; --dash:#4A4E55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1B1F; --fg:#F5F5F7; --mu:#9499A3; --sf:#24262B; --pl:#2A2C31; --ln:#2E3035; --v:#CACED4;
  --pr:#F5F5F7; --prf:#1A1B1F; --call:#2DBE6C; --callf:#04200F; --callt:#3DD17D;
  --dg:#FF6B6F; --dgb:#33201F; --dgt:#F2C4C6; --wc:#1F2E28; --wcd:#344D42; --qt:#42454B;
  --scrim:rgba(0,0,0,.6); --sheet:#202226; --segon:#3A3D43;
  --ok:#3DD17D; --warn:#F2B84B; --star:#F2B84B; --staroff:#4A4E55; --trk:#3A3D43; --dash:#4A4E55; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;border:0;margin:0;padding:0;cursor:pointer;background:none;color:inherit}
input,textarea{font:inherit;color:inherit}
input::placeholder{color:#8E939B}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--callt);outline-offset:2px;border-radius:8px}
h1,h2{text-wrap:balance}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 110px);display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:var(--pl);font-size:15px;font-weight:500}
.circle{width:44px;height:44px;border-radius:50%;background:var(--pl);display:flex;align-items:center;justify-content:center;flex:none}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--mu);font-weight:600;text-transform:uppercase}
.h1{margin:2px 0 0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.h2{margin:0;font-size:22px;font-weight:700}
.muted{color:var(--mu)}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:14px;background:var(--sf);color:var(--mu)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--pl);font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pr);color:var(--prf);font-weight:500}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;line-height:1.2}
.cat span{width:60px;height:60px;border-radius:16px;background:var(--sf);display:flex;align-items:center;justify-content:center}
.season{border-radius:20px;overflow:hidden;background:var(--wc);color:#FFF;min-height:250px;position:relative;display:flex;flex-direction:column;cursor:pointer;isolation:isolate}
.season .deco{position:absolute;right:-20px;top:30px;z-index:-1}
.season .top{padding:16px 18px 0;flex:1}
.season .bar{background:rgba(0,0,0,.35);padding:12px 16px;display:flex;align-items:center;gap:12px;margin-top:24px}
.tip{border-radius:20px;background:var(--sf);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%}
.back{display:flex;align-items:center;gap:2px;height:44px;font-size:16px;font-weight:500}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--ln)}
.item>button.main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.ava{width:60px;height:60px;border-radius:15px;color:#FFF;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.ava.big{width:104px;height:104px;border-radius:24px;font-size:34px}
.stack{display:flex;flex-direction:column;min-width:0}
.name{font-size:16px;font-weight:600}
.sub{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callmini{height:36px;padding:0 14px;border-radius:18px;background:var(--pl);color:var(--callt);font-size:14px;font-weight:600;flex:none}
.callbtn{height:40px;padding:0 22px;border-radius:20px;background:var(--call);color:var(--callf);font-size:16px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;padding:12px 0;border-top:.5px solid var(--ln);border-bottom:.5px solid var(--ln)}
.stats>div+div{border-left:.5px solid var(--ln)}
.stat-k{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--mu);text-transform:uppercase}
.stat-v{font-size:20px;font-weight:700;color:var(--v);font-variant-numeric:tabular-nums;min-height:26px;display:flex;align-items:center;justify-content:center}
.stat-s{font-size:11px;color:var(--mu)}
.svc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--ln)}
.svc .t{flex:1;min-width:0;font-size:16px}
.svc .p{font-size:15px;font-weight:500;color:var(--v);white-space:nowrap;font-variant-numeric:tabular-nums}
.review{background:var(--sf);border-radius:16px;padding:14px}
.reply{border-left:2px solid var(--qt);padding-left:10px;margin-top:12px}
.wide{display:flex;align-items:center;justify-content:center;height:46px;border-radius:14px;background:var(--pl);font-size:15px;font-weight:600;width:100%}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--dgb);border-radius:16px;padding:14px;color:var(--dgt);font-size:14px;line-height:1.4}
.photos{display:flex;gap:10px;overflow-x:auto;margin-right:-20px;padding-right:20px;scrollbar-width:none}
.photos img{width:130px;height:190px;border-radius:16px;object-fit:cover;flex:none;background:var(--sf)}
.empty{padding:40px 8px;text-align:center;color:var(--mu);font-size:15px;line-height:1.5}
.skel{background:var(--sf);border-radius:12px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.sheet{transition:none!important}}
.demo{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:var(--pl);color:var(--mu);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:.5px solid var(--ln);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 10px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mu);padding:4px 0}
nav.tabs button[aria-current="page"]{color:var(--fg);font-weight:600}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:20px 20px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 24px);max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;max-width:480px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 14px}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:700}
.sheet p{margin:0 0 14px;font-size:15px;line-height:1.5;color:var(--mu)}
.btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:27px;font-size:17px;font-weight:600;width:100%}
.btn.pr{background:var(--pr);color:var(--prf)}
.btn.call{background:var(--call);color:var(--callf)}
.btn.sec{background:var(--pl)}
.phone{font-size:30px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums;margin:6px 0 18px;user-select:all}
.opt{display:flex;align-items:center;justify-content:space-between;height:52px;border-bottom:.5px solid var(--ln);font-size:16px;width:100%;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%);background:var(--pr);color:var(--prf);padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.lbl{font-size:13px;font-weight:600;color:var(--mu)}
.inp{height:52px;padding:0 16px;border-radius:14px;border:0;background:var(--sf);color:var(--fg);font-size:16px;outline:none;width:100%}
textarea.inp{height:auto;padding:14px 16px;line-height:1.45;resize:vertical;min-height:96px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 22px) 23px,calc(100% - 16px) 23px;background-size:6px 6px;background-repeat:no-repeat}
.inp:focus{box-shadow:0 0 0 2px var(--pr)}
.code{font-size:30px;font-weight:600;letter-spacing:.5em;text-align:center;height:68px;padding-left:.5em;font-variant-numeric:tabular-nums}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;cursor:pointer}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--pr)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--trk);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#FFF;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.group{border-radius:14px;background:var(--sf);overflow:hidden}
.grow{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 8px 6px 16px;border-bottom:.5px solid var(--ln)}
.grow:last-child{border-bottom:0}
.grow .t{flex:1;min-width:0;font-size:16px}
.grow .p{font-size:15px;color:var(--mu);white-space:nowrap}
.iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--mu);flex:none}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pgrid .cell{aspect-ratio:1;border-radius:14px;position:relative;overflow:hidden;background:var(--sf)}
.pgrid .cell img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .cell button.del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#FFF;display:flex;align-items:center;justify-content:center}
.pgrid .add{border:1.5px dashed var(--dash);background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500}
.card{background:var(--sf);border-radius:20px;padding:18px}
.badge{background:var(--pr);color:var(--prf);font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:8px}
.pbar{height:6px;border-radius:3px;background:var(--trk);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--pr);border-radius:3px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sf);border-radius:16px;padding:14px}
.tile b{display:block;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{width:50px;height:50px;display:flex;align-items:center;justify-content:center;color:var(--staroff)}
.stars button.on{color:var(--star)}
.radio{width:100%;min-height:54px;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;border-bottom:.5px solid var(--ln)}
.radio:last-child{border-bottom:0}
.radio .r{width:22px;height:22px;border-radius:50%;border:2px solid var(--dash);display:flex;align-items:center;justify-content:center;flex:none}
.radio[aria-checked="true"] .r{border-color:var(--pr)}
.radio[aria-checked="true"] .r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pr)}
.btn.dg{background:var(--dg);color:#FFF}
.btn[disabled]{opacity:.5;cursor:default}
.link{font-size:15px;font-weight:500;color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;margin-bottom:-8px}
.topbar>:last-child{justify-self:end}
.topbar .ttl{font-size:16px;font-weight:600}
/* ---------- настройки ---------- */
.setx{display:flex;flex-direction:column;gap:10px;margin-top:-14px}
.sec-h{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--mu);text-transform:uppercase;margin:14px 4px 0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--sf)}
.seg button{height:40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu)}
.seg button[aria-checked="true"]{background:var(--segon);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.srow{width:100%;min-height:54px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;text-align:left;border-bottom:.5px solid var(--ln);line-height:1.3}
.group>.srow:last-child{border-bottom:0}
.srow .v{color:var(--mu);display:flex;align-items:center;gap:4px;flex:none}
.note{font-size:13px;line-height:1.45;color:var(--mu);margin:0 4px}
.foot{text-align:center;font-size:12px;line-height:1.6;color:var(--mu);margin-top:18px}
/* ---------- экраны поверх приложения (вход, отзыв, жалоба) ---------- */
.screen{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .25s ease}
.screen.on{transform:none}
.screen>.in{max-width:480px;margin:0 auto;min-height:100%;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 8px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column}
.scr-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;gap:8px}
.scr-top>:last-child{justify-self:end}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px}
.chips.scroll::-webkit-scrollbar{display:none}
.scr-top .ttl{font-size:17px;font-weight:600}
.scr-top .side{display:flex}
.scr-top .side:last-child{justify-content:flex-end}
.scr-body{display:flex;flex-direction:column;flex:1;gap:16px;margin-top:16px}
.brand{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:36px}
.lg-h{margin:0;font-size:26px;font-weight:700}
.lg-p{margin:-8px 0 6px;font-size:15px;line-height:1.45;color:var(--mu)}
.lg-small{margin:0;font-size:12px;line-height:1.45;color:var(--mu);text-align:center}
.cells{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cells span{height:68px;border-radius:16px;border:2px solid var(--trk);background:var(--sf);font-size:30px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cells span.f{border-color:var(--pr)}
.cells input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px;caret-color:transparent}
.spacer{flex:1;min-height:12px}
.who{display:flex;align-items:center;gap:14px}
.who .ava{width:56px;height:56px;border-radius:14px;font-size:19px}
ol.rules{margin:0 0 18px;padding-left:20px;font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
</style>
</head>

  if(/anonymous/i.test(m) && /disabled/i.test(m)) return 'Гостевой вход пока выключен в настройках Supabase.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Нет связи с сервером. Проверьте интернет.';
  return 'Не получилось: '+(m||'неизвестная ошибка');
}

/* ---------- тема ---------- */
function applyTheme(){
  var t = store('ub_theme') || 'system';
  if(t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  var dark = t==='dark' || (t==='system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark?'#1A1B1F':'#FFFFFF');
}
applyTheme();

/* ---------- состояние ---------- */
var S = { cities:[], cats:[], city:null, count:null, popular:[], season:null, session:null, stack:[] , allCats:false };
var app = document.getElementById('app');

sb.auth.getSession().then(function(r){ S.session = r.data.session; });
sb.auth.onAuthStateChange(function(_e, s){ S.session = s; });
function isGuest(){ return !!(S.session && S.session.user && S.session.user.is_anonymous); }
function isRegistered(){ return !!(S.session && S.session.user && !S.session.user.is_anonymous); }
function cityName(){ var c=S.cities.find(function(x){return x.id===S.city;}); return c?c.name:''; }
function cityIn(){ var n=cityName(); return n ? n.replace(/ск$/,'ске').replace(/а$/,'е') : ''; }

/* ---------- навигация ---------- */
var view = { name:'home' };
function go(v, push){ if(push!==false) S.stack.push(view); view=v; render(); window.scrollTo(0,0); }
function back(){ view = S.stack.pop() || {name:'home'}; render(); window.scrollTo(0,0); }
window.addEventListener('popstate', function(){ if(S.stack.length) back(); });

function tabs(){
  var cur = view.name==='list' || view.name==='profile' ? 'search' : (view.name==='profEdit'||view.name==='sphere') ? 'cab' : view.name;
  if(view.name==='profile' && view.own) cur = 'cab';
  if(view.name==='settings') cur = view.tab||'cab';
  var items = [['home','Главная',I.home],['search','Поиск',I.search],['fav','Избранное',I.heart],['cab','Кабинет',I.user]];
  document.getElementById('tabs').innerHTML = items.map(function(t){
    return '<button type="button" data-tab="'+t[0]+'"'+(cur===t[0]?' aria-current="page"':'')+'>'+svg(t[2],24)+t[1]+'</button>';
  }).join('');
}
document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('[data-tab]'); if(!b) return;
  var t = b.getAttribute('data-tab');
  S.stack = [];
  if(t==='home') go({name:'home'}, false);
  if(t==='search') go({name:'list', query:'', title:'Все мастера'}, false);
  if(t==='fav') go({name:'fav'}, false);
  if(t==='cab') go({name:'cab'}, false);
});

/* ---------- данные ---------- */
function loadBase(){
  return Promise.all([
    sb.from('cities').select('id,name,region').order('sort'),
    sb.from('categories').select('id,slug,name,sort').order('sort')
  ]).then(function(r){
    if(r[0].error) throw r[0].error; if(r[1].error) throw r[1].error;
    S.cities = r[0].data; S.cats = r[1].data;
    var saved = Number(store('ub_city'));
    S.city = S.cities.some(function(c){return c.id===saved;}) ? saved : (S.cities[0] && S.cities[0].id);
    return loadCity();
  });
}
function loadCity(){
  S.count=null; S.popular=[]; S.season=null;
  return Promise.all([
    sb.rpc('count_masters',{p_city:S.city}),
    sb.rpc('suggest_queries',{p_city:S.city, p_prefix:'', p_limit:6}),
    sb.rpc('search_spheres',{p_city:S.city, p_query:'утепление', p_limit:50})
  ]).then(function(r){
    S.count = r[0].data||0;
    S.popular = (r[1].data||[]).map(function(x){return typeof x==='string'?x:x.suggest_queries;});
    S.season = (r[2].data||[]).length;
    if(view.name==='home') render();
  });
}

/* ---------- экраны ---------- */
function render(){
  tabs();
  if(view.name==='home') return homeView();
  if(view.name==='list') return listView();
  if(view.name==='profile') return profileView();
  if(view.name==='fav') return favView();
  if(view.name==='cab') return cabView();
  if(view.name==='profEdit') return profEditView();
  if(view.name==='sphere') return sphereView();
  if(view.name==='settings') return settingsView();
}

var DAY = 86400000;
function dmy(iso){ var d=new Date(iso); return d.getDate()+' '+MG[d.getMonth()]; }
function daysLeft(iso){ return Math.max(0, Math.ceil((new Date(iso)-Date.now())/DAY)); }
function uid(){ return S.session && S.session.user ? S.session.user.id : null; }
function dbMsg(e){
  var m = (e && (e.message||'')) + ' ' + ((e && e.hint)||'');
  var map = {
    spheres_limit:'Достигнут лимит активных направлений. Снимите с публикации другое или подключите Про.',
    spheres_total_limit:'В профиле может быть не больше 20 направлений.',
    services_limit:'Достигнут лимит услуг в направлении. В Про — без лимита.',
    photos_limit:'Достигнут лимит фото в направлении. В Про — до 30.',
    city_change_too_soon:'Город можно менять не чаще раза в 30 дней.',
    review_no_contact:'Отзыв можно оставить в течение 30 дней после звонка мастеру через Уустары бул.',
    review_own_profile:'Нельзя оставить отзыв самому себе.',
    complaint_own_profile:'Нельзя пожаловаться на себя.',
    sphere_blocked:'Это направление скрыто после жалоб, опубликовать его нельзя.',
    registration_required:'Нужен вход по номеру телефона.'
  };
  for(var k in map) if(m.indexOf(k)>=0) return map[k];
  if(e && e.code==='23505') return null;
  return errText(e);
}
function catById(id){ return S.cats.find(function(c){return c.id===id;}) || {name:'',slug:''}; }
function confirmSheet(title, text, label, onOk){
  openSheet('<h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><button type="button" class="btn dg" id="ok">'+esc(label)+'</button><button type="button" class="btn" data-close style="margin-top:6px">Отмена</button>',
    function(){ document.getElementById('ok').onclick = function(){ closeSheet(); onOk(); }; });
}

function loadMine(){
  var id = uid();
  var since = new Date(Date.now()-30*DAY).toISOString().slice(0,10);
  return Promise.all([
    sb.from('profiles').select('*').eq('id',id).maybeSingle(),
    sb.from('spheres').select('id,title,description,category_id,status,published_at,expires_at,created_at,services(id,is_hidden),photos(id,is_hidden)').eq('profile_id',id).order('created_at'),
    sb.rpc('profile_limits',{p_profile:id}),
    sb.from('reviews').select('id,author_name,title,rating,body,reply,created_at,is_hidden').eq('profile_id',id).order('created_at',{ascending:false}),
    sb.from('stats_daily').select('views,contacts').eq('profile_id',id).gte('day',since)
  ]).then(function(r){
    var err = r[0].error||r[1].error;
    if(err) throw err;
    var lim = (r[2].data && r[2].data[0]) || {spheres:2, services_per_sphere:5, photos_per_sphere:10};
    var st = (r[4].data||[]).reduce(function(a,x){ a.views+=x.views; a.contacts+=x.contacts; return a; }, {views:0, contacts:0});
    return { p:r[0].data, spheres:r[1].data||[], lim:lim, reviews:r[3].data||[], stats:st };
  });
}
function sphereState(s, pro){
  var d = s.expires_at ? daysLeft(s.expires_at) : 0;
  if(s.status==='active'){
    if(pro) return {t:'Активна · продлится сама '+dmy(s.expires_at), c:'var(--ok)'};
    if(d<=3) return {t:'Осталось '+d+' '+plural(d,'день','дня','дней'), c:'var(--warn)', renew:true};
    return {t:'Активна · осталось '+d+' '+plural(d,'день','дня','дней'), c:'var(--ok)'};
  }
  if(s.status==='draft') return {t:'Черновик · не показывается', c:'var(--mu)', publish:true};
  if(s.status==='expired') return {t:'Срок вышел · не показывается', c:'var(--warn)', renew:true};
  if(s.status==='paused') return {t:'На паузе: превышен лимит тарифа', c:'var(--warn)'};
  if(s.status==='hidden') return {t:'Скрыта после жалоб', c:'var(--dg)'};
  return {t:'Заблокирована', c:'var(--dg)'};
}

function shrink(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var k = Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('Не удалось обработать фото')); }, 'image/jpeg', 0.82);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('Не удалось открыть фото. Подойдут JPG и PNG.')); };
    img.src = url;
  });
}
function photoUrl(path){ return SB_URL+'/storage/v1/object/public/photos/'+path; }

/* Загрузка фото по одному: уменьшаем, кладём в хранилище, записываем в базу */
function uploadPhotos(sphereId, files, sort, onStep){
  return files.reduce(function(chain, f, i){
    return chain.then(function(){
      return shrink(f).then(function(blob){
        var path = uid()+'/'+sphereId+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
        return sb.storage.from('photos').upload(path, blob, {contentType:'image/jpeg'}).then(function(up){
          if(up.error) throw up.error;
          return sb.from('photos').insert({sphere_id:sphereId, storage_path:path, sort: sort+i+1}).then(function(r){
            if(r.error){ sb.storage.from('photos').remove([path]); throw r.error; }
            if(onStep) onStep(i+1);
          });
        });
      });
    });
  }, Promise.resolve());
}

/* ---------- шторки ---------- */
var sheetEl, scrimEl, lastFocus;
function openSheet(html, after){
  closeSheet(true);
  lastFocus = document.activeElement;
  scrimEl = document.createElement('div'); scrimEl.className='scrim';
  sheetEl = document.createElement('div'); sheetEl.className='sheet'; sheetEl.setAttribute('role','dialog'); sheetEl.setAttribute('aria-modal','true');
  sheetEl.innerHTML = '<div class="grab" aria-hidden="true"></div>'+html;
  document.body.appendChild(scrimEl); document.body.appendChild(sheetEl);
  scrimEl.onclick = function(){ closeSheet(); };
  requestAnimationFrame(function(){ scrimEl.classList.add('on'); sheetEl.classList.add('on'); var f=sheetEl.querySelector('button,a,input'); if(f) f.focus({preventScroll:true}); });
  sheetEl.querySelectorAll('[data-close]').forEach(function(b){ b.onclick=function(){ closeSheet(); }; });
  if(after) after(sheetEl);
}
function closeSheet(now){
  if(!sheetEl) return; var s=sheetEl, c=scrimEl; sheetEl=scrimEl=null;
  if(now){ s.remove(); c.remove(); return; }
  s.classList.remove('on'); c.classList.remove('on'); setTimeout(function(){ s.remove(); c.remove(); },250);
  if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
/* Экран поверх приложения: вход, отзыв, жалоба. Повторный вызов меняет содержимое без анимации. */
var screenEl = null;
function openScreen(html, after){
  closeSheet(true);
  if(!screenEl){
    screenEl = document.createElement('div'); screenEl.className='screen'; screenEl.setAttribute('role','dialog'); screenEl.setAttribute('aria-modal','true');
    screenEl.innerHTML = '<div class="in"></div>';
    document.body.appendChild(screenEl);
    var s = screenEl; requestAnimationFrame(function(){ s.classList.add('on'); });
    document.body.style.overflow = 'hidden';
  }
  screenEl.scrollTop = 0;
  screenEl.firstChild.innerHTML = html;
  screenEl.querySelectorAll('[data-close]').forEach(function(b){ b.onclick=function(){ closeScreen(); }; });
  if(after) after(screenEl);
}
function closeScreen(){
  if(!screenEl) return; var s = screenEl; screenEl = null;
  document.body.style.overflow = '';

/* ---------- вход по номеру (звонок-сброс через Zvonok) ---------- */
var DOC_VERSION = '2026-10-10';
function fmtPhoneInput(el){
  var d = el.value.replace(/\D/g,'');
  if(d[0]==='8'||d[0]==='7') d = d.slice(1);
  d = d.slice(0,10);
  if(!d){ el.value=''; return; }
  var o = '+7 '+d.slice(0,3);
  if(d.length>3) o += ' '+d.slice(3,6);
  if(d.length>6) o += '-'+d.slice(6,8);
  if(d.length>8) o += '-'+d.slice(8,10);
  el.value = o;
}
function callVerify(body){
  return sb.functions.invoke('verify-phone', { body: body }).then(function(r){
    if(!r.error) return r.data;
    var ctx = r.error.context;
    if(ctx && typeof ctx.json==='function'){
      return ctx.json().then(function(b){ throw new Error((b&&b.error)||r.error.message); }, function(){ throw r.error; });
    }
    throw r.error;
  });
}

      '<p class="lg-p">на '+esc(phone)+'. Введите последние 4 цифры номера, с которого звонят.</p>'+
      '<div class="cells" id="cells"><span></span><span></span><span></span><span></span>'+
        '<input id="cc" inputmode="numeric" autocomplete="one-time-code" maxlength="4" aria-label="Последние 4 цифры номера"></div>'+
      '<div style="font-size:15px"><button type="button" id="again" class="muted" disabled>Позвонить ещё раз через 1:00</button></div>'+
      '<div class="spacer"></div>'+
      '<button class="btn pr" id="cb" type="submit">Войти</button>'+
      '<button type="button" id="fb" class="btn sec" hidden>Звонок не пришёл</button>'+
      '<button type="button" id="chg" class="btn" style="height:48px;font-size:15px;font-weight:500">Изменить номер</button>'+
      '</form>'),
    function(){
      document.getElementById('lgBack').onclick = stepPhone;
      var cc = document.getElementById('cc'), cells = document.getElementById('cells').querySelectorAll('span');
      function paint(){ var v = cc.value; cells.forEach(function(c, i){ c.textContent = v[i]||''; c.className = (i < v.length || (i===v.length && document.activeElement===cc)) ? 'f' : ''; }); }
      function submit(){
        var code = cc.value.replace(/\D/g,''); if(code.length!==4) return toast('Введите 4 цифры');
        var b=document.getElementById('cb'); b.disabled=true; b.textContent='Проверяем…';
        callVerify({action:'confirm', phone:phone, code:code}).then(function(d){ clearT(); return finishLogin(d, after); })
          .catch(function(err){ b.disabled=false; b.textContent='Войти'; cc.value=''; paint(); toast(err.message); });
      }
      cc.addEventListener('input', function(){ cc.value = cc.value.replace(/\D/g,'').slice(0,4); paint(); if(cc.value.length===4) submit(); });
      cc.addEventListener('focus', paint); cc.addEventListener('blur', paint);
      setTimeout(function(){ cc.focus({preventScroll:true}); paint(); }, 300);
      document.getElementById('cf').addEventListener('submit', function(e){ e.preventDefault(); submit(); });
      document.getElementById('chg').onclick = stepPhone;
      var left = 60, ag = document.getElementById('again');
      (function tick(){
        if(!document.getElementById('again')) return;
        if(left<=0){ ag.disabled=false; ag.className='link'; ag.textContent='Позвонить ещё раз'; return; }
        ag.textContent='Позвонить ещё раз через '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); left--; timers.push(setTimeout(tick,1000));
      })();
      ag.onclick = function(){ ag.disabled=true; callVerify({action:'start', phone:phone}).then(function(){ toast('Звоним ещё раз'); stepCode(); }, function(err){ ag.disabled=false; toast(err.message); }); };
      timers.push(setTimeout(function(){ var f=document.getElementById('fb'); if(f) f.hidden=false; }, 15000));
      document.getElementById('fb').onclick = stepFallback;
    });
  }
  function stepFallback(){
    clearT();
    callVerify({action:'start_fallback', phone:phone}).then(function(d){
      var nums = (d.numbers||[]).map(String);
      openScreen(shell('Назад',
        '<div class="scr-body" style="margin-top:40px">'+
        '<h1 class="lg-h">Позвоните нам</h1>'+
        '<p class="lg-p">Позвоните с номера '+esc(phone)+' на номер ниже. Звонок бесплатный и сбросится сам.</p>'+
        '<div class="group">'+(nums.length? nums.map(function(n){
          var dg = n.replace(/\D/g,''); return '<a class="grow" href="tel:+'+esc(dg)+'"><span class="t" style="font-size:20px;font-weight:600;font-variant-numeric:tabular-nums">+'+esc(dg)+'</span></a>'; }).join('')
          : '<div class="grow"><span class="t muted">Номер не получен, попробуйте через минуту</span></div>')+'</div>'+
        '<div class="spacer"></div>'+
        '<button type="button" class="btn pr" id="done">Я позвонил</button>'+
        '</div>'),
      function(){
        document.getElementById('lgBack').onclick = stepCode;
        var tries = 0;
        document.getElementById('done').onclick = function poll(){
          var b=document.getElementById('done'); if(!b) return; b.disabled=true; b.textContent='Проверяем…';
          callVerify({action:'check_fallback', phone:phone}).then(function(d){
            if(d && d.token_hash) return finishLogin(d, after);
            tries++;
            if(tries<5) timers.push(setTimeout(poll, 3000));
            else { b.disabled=false; b.textContent='Я позвонил'; tries=0; toast('Звонок пока не найден. Попробуйте ещё раз через минуту.'); }
          }).catch(function(err){ b.disabled=false; b.textContent='Я позвонил'; toast(err.message); });
        };
      });
    }, function(err){ toast(err.message); });
  }
  stepPhone();
}

function needRegistration(text, after){
  openSheet('<h2>Нужен вход по номеру</h2><p>'+esc(text)+'</p><button type="button" class="btn pr" id="nl">Войти по номеру</button><button type="button" class="btn" data-close style="margin-top:6px">Не сейчас</button>',
    function(){ document.getElementById('nl').onclick = function(){ loginSheet(after); }; });
}
function toggleFav(id, v){
  if(!isRegistered()) return needRegistration('Избранное сохраняется в аккаунте, поэтому доступно после входа по номеру телефона.', function(){ toggleFav(id, v); });
  var q = v.fav ? sb.from('favorites').delete().eq('profile_id',id) : sb.from('favorites').insert({profile_id:id});
  q.then(function(r){ if(r.error) return toast(errText(r.error)); v.fav=!v.fav; toast(v.fav?'Добавлено в избранное':'Убрано из избранного'); profileView(); });
}

/* ---------- номер мастера ---------- */
function contact(pid, sid, kind){
  if(!S.session) return openSheet('<h2>Как связаться с мастером</h2><p>Чтобы увидеть номер, войдите по номеру телефона или продолжите как гость. Гость может посмотреть до 20 номеров в день.</p>'+
    '<button type="button" class="btn pr" id="guestBtn">Продолжить как гость</button><button type="button" class="btn sec" id="lgBtn" style="margin-top:10px">Войти по номеру</button>',
    function(){
      document.getElementById('lgBtn').onclick = function(){ loginSheet(function(){ contact(pid, sid, kind); }); };
      var g = document.getElementById('guestBtn');
      g.onclick = function(){
        g.disabled=true; g.textContent='Входим…';
        sb.auth.signInAnonymously().then(function(r){
          if(r.error){ g.disabled=false; g.textContent='Продолжить как гость'; return toast(errText(r.error)); }
          S.session = r.data.session; contact(pid, sid, kind);
        });
      };
    });
  openSheet('<h2>Номер мастера</h2><div class="skel" style="height:36px;width:70%;margin:10px 0 20px"></div>');
  sb.rpc('get_contact',{p_profile:pid, p_sphere:sid||null, p_kind:kind}).then(function(r){
    if(r.error){ closeSheet(); return toast(errText(r.error)); }
    var ph = String(r.data||''); var digits = ph.replace(/\D/g,''); if(digits.length===11&&digits[0]==='8') digits='7'+digits.slice(1);
    var pretty = digits.length===11 ? '+7 '+digits.slice(1,4)+' '+digits.slice(4,7)+'-'+digits.slice(7,9)+'-'+digits.slice(9) : ph;
    openSheet('<h2>'+(kind==='message'?'Написать мастеру':'Номер мастера')+'</h2>'+
      '<div class="phone">'+esc(pretty)+'</div>'+
      '<a class="btn call" href="'+(kind==='message'?'sms:':'tel:')+'+'+digits+'">'+(kind==='message'?'Написать СМС':'Позвонить')+'</a>'+
      '<button type="button" class="btn sec" id="cp" style="margin-top:10px">Скопировать номер</button>'+
      '<p style="margin-top:14px;font-size:13px">Скажите мастеру, что нашли его на Уустары бул.</p>',
    function(){ document.getElementById('cp').onclick=function(){
      if(navigator.clipboard) navigator.clipboard.writeText(pretty).then(function(){toast('Номер скопирован');},function(){toast(pretty);}); else toast(pretty); }; });
  });
}

/* ---------- старт ---------- */
render();
loadBase().then(render).catch(function(e){ app.innerHTML='<h1 class="h1">Уустары бул</h1><div class="empty">'+esc(errText(e))+'</div>'; });
})();
</script>
