# Уустары бул — вход на сервер только по ключу (план, Часть 2, шаг 7).
# Ставит server/deploy.sh в /etc/ssh/sshd_config.d/ — и только если у root есть ключ ПК пользователя
# и вход по нему уже был. Файл с «00-» читается раньше 50-cloud-init.conf, поэтому его значения главнее.
# Запасной путь, если ключ потерян: консоль (VNC) в панели FirstVDS — там вход по паролю root работает.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
