# Уустары бул — fail2ban: неверный пароль панели Supabase (Studio, :8443).
# Caddy пишет журнал панели в JSON (server/Caddyfile → /var/log/ub-caddy/studio.log).
# Неверный пароль = ответ 401 на запрос, где браузер прислал заголовок Authorization
# (первый 401 без заголовка — обычный вопрос пароля, его не считаем). Сам пароль Caddy в журнал не пишет (REDACTED).
[Definition]
# Кавычки внутри значений JSON экранированы, поэтому "Authorization":["REDACTED"] без обратной черты — только настоящий заголовок.
failregex = ^\{.*"remote_ip":"<HOST>".*"Authorization":\["REDACTED"\].*"status":401,
ignoreregex =
datepattern = "ts":{EPOCH}
